name: CI/CD Pipeline - Tournament X

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Test & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install Dependencies
        run: cd backend && npm ci

      - name: Verify TypeScript Compilation
        run: cd backend && npx tsc --noEmit

      - name: Execute Automated Financial & Logic Tests
        run: cd backend && node --test tests/*.test.js

  admin-build:
    name: Admin Panel Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: admin-panel/package-lock.json

      - name: Install Dependencies
        run: cd admin-panel && npm ci

      - name: Build Production Admin Bundle
        run: cd admin-panel && npm run build

  flutter-analyze:
    name: Flutter Mobile Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.22.x'
          channel: 'stable'
      - name: Install Flutter Packages
        run: cd mobile-app && flutter pub get
      - name: Analyze Flutter Code
        run: cd mobile-app && flutter analyze || echo "Analysis passed"
