version: '3.8'

services:
  # 1. PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: tournament_x_postgres
    restart: always
    environment:
      POSTGRES_DB: tournament_x_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backend/src/database/schema.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Redis Cache & Job Queues
  redis:
    image: redis:7-alpine
    container_name: tournament_x_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  # 3. Node.js Production Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: tournament_x_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 5000
      HOST: 0.0.0.0
      DATABASE_URL: postgres://postgres:postgrespassword@postgres:5432/tournament_x_db
      REDIS_URL: redis://redis:6379
      DEMO_MODE: "true"
      PRODUCTION_FINANCIAL_MODE: "false"
      JWT_SECRET: super_secret_jwt_key_at_least_32_characters_long_entropy_key!
      JWT_REFRESH_SECRET: super_secret_refresh_jwt_key_at_least_32_characters_entropy!
      ADMIN_JWT_SECRET: super_secret_admin_jwt_key_at_least_32_characters_enterprise!
    ports:
      - "5000:5000"

  # 4. Esports Command Admin Panel (Nginx Serving Production Build)
  admin:
    build:
      context: ./admin-panel
      dockerfile: Dockerfile
    container_name: tournament_x_admin
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  pgdata:
  redisdata:
